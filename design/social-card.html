<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Portfolio sharing card — 1200 × 630</title>
    <!-- Open through Vite and capture at exactly 1200 × 630 after fonts load.
         This design source is not a production entry point. -->
    <style>
      @font-face {
        font-family: "Inter Tight";
        src: url("../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #111111;
        color: #ededed;
        font-family: "Inter Tight", sans-serif;
        padding: 48px 56px;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        justify-content: space-between;
        color: #a0a0a0;
        font-size: 15px;
        font-weight: 550;
        letter-spacing: 0.075em;
      }
      h1 {
        margin: 66px 0 0;
        font-weight: 900;
        letter-spacing: -0.065em;
        line-height: 0.88;
      }
      h1 span {
        display: block;
      }
      .first-name {
        font-size: 184px;
      }
      .last-name {
        font-size: 140px;
        text-align: right;
        margin-top: 20px;
      }
      footer {
        margin-top: auto;
        padding-top: 24px;
        border-top: 1px solid #343434;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      p {
        margin: 0;
        font-size: 27px;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      .secondary {
        color: #a0a0a0;
      }
      .domain {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 23px;
      }
      svg {
        width: 25px;
        height: 25px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
      }
    </style>
  </head>
  <body>
    <header><span>PORTFOLIO</span><span>SKOPJE, NORTH MACEDONIA</span></header>
    <h1>
      <span class="first-name">JAKOV</span
      ><span class="last-name">SPIROVSKI</span>
    </h1>
    <footer>
      <p>
        Mobile Developer<br /><span class="secondary"
          >National Robotics Team Lead</span
        >
      </p>
      <p class="domain">
        jakovspirovski.dev<svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 19 19 5M5 5h14v14" />
        </svg>
      </p>
    </footer>
  </body>
</html>
